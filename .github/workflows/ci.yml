# Checks every pull request (and main) before it can ship.
# Runs the same tests CLAUDE.md asks for, on the three systems people use the app on.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.9", "3.14"]      # oldest and newest supported (PYTHON_MIN / PYTHON_MAX)
        exclude:
          # setup-python has no 3.9 build for the newest ubuntu-latest image (26.04);
          # run the Linux 3.9 job on 24.04, which still has one.
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies (no speech model needed)
        run: python -m pip install numpy imageio-ffmpeg
      - name: Unit tests
        run: python tests/test_core.py
      - name: Timing accuracy (simulated speech-model errors)
        run: python tests/stress.py --check
      - name: Subtitle cut quality
        run: python tests/cuts.py --check

  compatibility:
    name: Python 3.9 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install vermin
      - name: No syntax or library calls newer than Python 3.9
        run: vermin -t=3.9- --no-tips --violations scriptsync_core.py scriptsync_gui.py tests/

  installable:
    # The launchers accept Python PYTHON_MIN..PYTHON_MAX (scriptsync_core.py). Check that requirements.txt
    # really installs from ready-made packages on each of them, for Windows and macOS, without downloading
    # the packages (pip only reads their metadata). Also reports whether the next Python works yet.
    name: Installs on every supported Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve requirements.txt for each supported Python, Windows and macOS
        run: |
          python - <<'PY'
          import re, subprocess, sys
          src = open("scriptsync_core.py", encoding="utf-8").read()
          lo = int(re.search(r"^PYTHON_MIN = \(3, (\d+)\)", src, re.M).group(1))
          hi = int(re.search(r"^PYTHON_MAX = \(3, (\d+)\)", src, re.M).group(1))

          def ok(minor, plat):
              r = subprocess.run([sys.executable, "-m", "pip", "install", "--dry-run", "--quiet",
                                  "--ignore-installed", "--only-binary=:all:", "--target", "/tmp/never",
                                  "--python-version", f"3.{minor}", "--platform", plat,
                                  "-r", "requirements.txt"], capture_output=True, text=True)
              return r.returncode == 0, r.stderr.strip().splitlines()[-1:] if r.returncode else []

          bad = []
          for minor in range(lo, hi + 1):
              for plat in ("win_amd64", "macosx_14_0_arm64"):
                  good, why = ok(minor, plat)
                  print(f"Python 3.{minor} {plat}: {'ok' if good else 'FAILS ' + ' '.join(why)}")
                  if not good:
                      bad.append(f"3.{minor} {plat}")
          nxt = hi + 1
          ready = all(ok(nxt, p)[0] for p in ("win_amd64", "macosx_14_0_arm64"))
          print(f"Python 3.{nxt}: {'installs now - PYTHON_MAX and the launchers can be raised' if ready else 'not yet'}")
          if bad:
              sys.exit("requirements.txt no longer installs on: " + ", ".join(bad))
          PY

  gui:
    name: GUI smoke test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tkinter, a virtual display and tools to make a test clip
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb ffmpeg espeak-ng imagemagick
      - name: Make a synthetic test clip
        run: python3 tests/make_test_clip.py "$RUNNER_TEMP/clip"
      - name: Sync it through the real window (speech model replaced by a stand-in)
        env:
          SCRIPTSYNC_ASR_PLUGIN: tests/fake_plugin.py
          LOCALAPPDATA: ${{ runner.temp }}/appdata
        run: xvfb-run -a -s "-screen 0 1280x1000x24" python3 tests/gui_smoke.py "$RUNNER_TEMP/clip" "$RUNNER_TEMP/gui.png"
      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot
          path: ${{ runner.temp }}/gui.png
          if-no-files-found: ignore
